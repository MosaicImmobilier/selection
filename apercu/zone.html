<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Test de la zone · MOSAIC</title>
<link rel="stylesheet" href="leaflet.css">
<style>
/* Page de test pour Joseph (31/10/2026) : la taille du rond autour d'une adresse, le point au centre. À supprimer après. */
@font-face { font-family: "Aftika"; font-weight: 100 500; src: url("Aftika-Light.otf"); }
@font-face { font-family: "Aftika"; font-weight: 600 900; src: url("Aftika-Bold.otf"); }
body { margin: 0; font-family: "Aftika", Arial, sans-serif; font-weight: 300; color: #003269; }
header { padding: 18px 20px 12px; }
h1 { font-size: 22px; margin: 0; font-weight: 700; }
p { margin: 6px 0 0; color: #4A5A75; }
.choix { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button { font: inherit; font-weight: 700; padding: 9px 14px; border: 1px solid #003269; background: #fff; color: #003269; cursor: pointer; }
button.actif { background: #003269; color: #fff; }
#carte { height: calc(100vh - 170px); min-height: 380px; }
.point { width: 12px; height: 12px; background: #E2001A; border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 0 0 1px #E2001A; }
</style>
</head>
<body>
<header>
  <h1>Test de la zone : 57 avenue Docteur Raymond Picaud, Cannes</h1>
  <p id="etat">Recherche de l'adresse…</p>
  <div class="choix"><button data-r="500">500 m</button><button data-r="800" class="actif">800 m (actuel)</button><button data-r="1200">1,2 km</button><button data-r="1500">1,5 km</button><button data-r="2000">2 km</button></div>
</header>
<div id="carte"></div>
<script src="leaflet.js"></script>
<script>
(async function () {
  const TUILES = "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";
  const etat = document.getElementById("etat");
  const carte = L.map("carte", { zoomControl: true }).setView([43.5528, 7.0174], 14);
  L.tileLayer(TUILES, { maxZoom: 19, attribution: "© IGN, Plan IGN" }).addTo(carte);
  let lat = 43.5528, lon = 7.0174;
  try {
    const r = await fetch("https://data.geopf.fr/geocodage/search?q=" + encodeURIComponent("57 avenue Docteur Raymond Picaud 06400 Cannes") + "&limit=1");
    const f = (await r.json()).features[0];
    [lon, lat] = f.geometry.coordinates;
    etat.textContent = "Point rouge : l'adresse exacte (" + f.properties.label + "). Le rond bleu est centré dessus pour juger la taille. Pour le client, le bien n'est jamais au centre du rond.";
  } catch (err) { etat.textContent = "Adresse introuvable (" + err.message + ")"; }
  L.marker([lat, lon], { icon: L.divIcon({ className: "", html: '<div class="point"></div>', iconSize: [12, 12] }) }).addTo(carte);
  const rond = L.circle([lat, lon], { radius: 800, color: "#009FE2", weight: 2, fillColor: "#009FE2", fillOpacity: 0.2 }).addTo(carte);
  const cadrer = () => carte.fitBounds(rond.getBounds(), { padding: [30, 30] });
  cadrer();
  document.querySelectorAll("[data-r]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-r]").forEach((x) => x.classList.toggle("actif", x === b));
    rond.setRadius(Number(b.dataset.r)); cadrer();
  }));
})();
</script>
</body>
</html>
